# Echo-Mate credential manifest. Never add real secret values here.
version: 1
owner: echomate
storage:
  directory: /etc/echomate/credentials
  directory_mode: "0700"
  file_mode: "0600"
  owner: root
  group: root

credentials:
  dashscope_api_key:
    purpose: DashScope ASR, Qwen and CosyVoice
    secret: true
    consumers:
      - echomate-server.service
      - echomate-feishu-bot.service
    rotation:
      cadence_days: 90
      last_rotated: null
      owner: user

  lark_app_id:
    purpose: Feishu application identity
    secret: false
    consumers:
      - echomate-feishu-bot.service
      - echomate-monitor.service
      - echomate-ssh-session-watch.service

  lark_app_secret:
    purpose: Feishu application authentication
    secret: true
    consumers:
      - echomate-feishu-bot.service
      - echomate-monitor.service
      - echomate-ssh-session-watch.service
    rotation:
      cadence_days: 90
      last_rotated: null
      owner: user

  lark_owner_open_id:
    purpose: Authorized Feishu owner identity
    secret: false
    consumers:
      - echomate-feishu-bot.service
      - echomate-monitor.service
      - echomate-ssh-session-watch.service

  tavily_api_key:
    purpose: Feishu assistant web search
    secret: true
    consumers:
      - echomate-feishu-bot.service
    rotation:
      cadence_days: 90
      last_rotated: null
      owner: user
